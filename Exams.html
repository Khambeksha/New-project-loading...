<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Results Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2733;--paper:#f2f4f6;--card:#fff;--line:#dde2e8;--muted:#667585;--teal:#0f766e;--amber:#b45309;--red:#b42318;--side:#1c2733}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.sidebar{width:230px;background:var(--side);min-height:100vh;position:fixed;top:0;left:0;padding:1.5rem 1rem}
.sidebar .brand{color:#fff;font-weight:600;font-size:1.1rem;padding:0 .75rem 1.5rem}
.sidebar .nav-link{color:#aebbc8;border-radius:6px;padding:.55rem .75rem;font-size:.92rem}
.sidebar .nav-link.active,.sidebar .nav-link:hover{background:#2a3948;color:#fff}
.main{margin-left:230px;padding:1.5rem 2rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1.25rem}
.kpi small{color:var(--muted)}
.kpi .v{font-size:1.9rem;font-weight:600;line-height:1.2}
.kpi .d{font-size:.82rem}
.up{color:var(--teal)}.down{color:var(--red)}
.table thead th{font-weight:500;color:var(--muted);font-size:.85rem;border-bottom:1px solid var(--line)}
.badge-pass{background:#d9f0ec;color:#0b5a53}.badge-fail{background:#fbe3e0;color:#8f1d14}.badge-review{background:#fbeccf;color:#80400a}
.bar{height:6px;border-radius:3px;background:#e6eaee;width:90px;display:inline-block;vertical-align:middle;margin-right:.5rem}
.bar i{display:block;height:100%;border-radius:3px}
.btn-main{background:var(--teal);color:#fff;border:0}.btn-main:hover{background:#0b5f58;color:#fff}
.form-control:focus,.form-select:focus{border-color:var(--teal);box-shadow:0 0 0 .2rem rgba(15,118,110,.2)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media(max-width:991px){.sidebar{display:none}.main{margin-left:0;padding:1rem}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">ExamDesk</div>
  <nav class="nav flex-column gap-1">
    <a class="nav-link active" href="#">Results</a>
    <a class="nav-link" href="#">Exams</a>
    <a class="nav-link" href="#">Students</a>
    <a class="nav-link" href="#">Question analysis</a>
    <a class="nav-link" href="#">Settings</a>
  </nav>
</aside>

<main class="main">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h1 class="h4 mb-1">Results</h1>
      <div class="text-secondary small">Submitted attempts for the selected exam</div>
    </div>
    <div class="d-flex gap-2">
      <select id="examSel" class="form-select" aria-label="Select exam">
        <option value="0">Biology Midterm</option>
        <option value="1">Algebra Final</option>
        <option value="2">World History Quiz</option>
      </select>
      <button class="btn btn-main text-nowrap" id="exportBtn">Export CSV</button>
    </div>
  </div>

  <div class="row g-3 mb-3" id="kpis"></div>

  <div class="row g-3 mb-3">
    <div class="col-lg-5"><div class="panel h-100"><h2 class="h6 mb-3">Score distribution</h2><canvas id="distChart" height="200"></canvas></div></div>
    <div class="col-lg-4"><div class="panel h-100"><h2 class="h6 mb-3">Outcome</h2><div style="max-width:220px" class="mx-auto"><canvas id="outChart"></canvas></div></div></div>
    <div class="col-lg-3"><div class="panel h-100"><h2 class="h6 mb-3">Section averages</h2><div id="sections"></div></div></div>
  </div>

  <div class="panel">
    <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
      <h2 class="h6 mb-0 align-self-center">Student results</h2>
      <div class="d-flex gap-2">
        <input id="search" class="form-control" placeholder="Search student" aria-label="Search student">
        <select id="statusSel" class="form-select" aria-label="Filter by outcome">
          <option value="">All outcomes</option><option>Passed</option><option>Failed</option><option>Review</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead><tr><th>Student</th><th>Score</th><th>Time taken</th><th>Submitted</th><th>Outcome</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="text-center text-secondary py-4 d-none">No students match. Clear the search or change the outcome filter.</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const exams=[
 {name:'Biology Midterm',pass:60,mins:60,sections:[['Cell biology',72],['Genetics',64],['Ecology',69],['Physiology',58]]},
 {name:'Algebra Final',pass:50,mins:90,sections:[['Equations',70],['Functions',61],['Polynomials',55],['Word problems',48]]},
 {name:'World History Quiz',pass:55,mins:30,sections:[['Ancient',74],['Medieval',66],['Modern',71]]}
];
const names=['Aarav Sharma','Maya Thapa','Liam Foster','Sita Gurung','Noah Bennett','Priya Rai','Emma Walsh','Bikash Shrestha','Olivia Chen','Arjun Karki','Sofia Alvarez','Rohan Joshi','Hannah Lee','Anita Magar','Daniel Ortiz','Kriti Basnet','Ethan Brooks','Nisha Tamang','Zoe Parker','Sagar Adhikari'];
function seeded(s){return()=>(s=(s*9301+49297)%233280)/233280}
function build(i){
  const r=seeded(i*7+3),e=exams[i];
  return names.map((n,k)=>{
    const score=Math.max(18,Math.min(100,Math.round(52+i*-4+(r()-.4)*55)));
    const time=Math.round(e.mins*(.55+r()*.45));
    const d=new Date(2026,9,20+Math.floor(r()*7),9+Math.floor(r()*8),Math.floor(r()*60));
    const flag=r()>.9;
    return {n,score,time,d,status:flag?'Review':(score>=e.pass?'Passed':'Failed')};
  });
}
let data=[],cur=0,dist,out;
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const col=s=>s>=75?'#0f766e':s>=50?'#b45309':'#b42318';
function kpis(){
  const e=exams[cur],n=data.length,avg=data.reduce((a,b)=>a+b.score,0)/n;
  const passed=data.filter(x=>x.status==='Passed').length;
  const sorted=data.map(x=>x.score).sort((a,b)=>a-b),med=(sorted[9]+sorted[10])/2;
  const avgT=data.reduce((a,b)=>a+b.time,0)/n;
  const items=[
    ['Average score',avg.toFixed(1)+'%','Pass mark '+e.pass+'%'],
    ['Pass rate',Math.round(passed/n*100)+'%',passed+' of '+n+' students'],
    ['Median score',med+'%','Top score '+sorted[n-1]+'%'],
    ['Avg. time taken',Math.round(avgT)+' min','of '+e.mins+' min allowed']
  ];
  document.getElementById('kpis').innerHTML=items.map(k=>`<div class="col-6 col-xl-3"><div class="panel kpi"><small>${k[0]}</small><div class="v">${k[1]}</div><div class="d text-secondary">${k[2]}</div></div></div>`).join('');
}
function charts(){
  const bins=[0,0,0,0,0];
  data.forEach(x=>bins[Math.min(4,Math.floor(x.score/20))]++);
  const labels=['0–19','20–39','40–59','60–79','80–100'];
  const c=['#b42318','#b45309','#8a8f98','#3b8f87','#0f766e'];
  if(dist)dist.destroy();
  dist=new Chart(document.getElementById('distChart'),{type:'bar',data:{labels,datasets:[{data:bins,backgroundColor:c,borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0},title:{display:true,text:'Students'}},x:{grid:{display:false},title:{display:true,text:'Score (%)'}}}}});
  const o=['Passed','Failed','Review'].map(s=>data.filter(x=>x.status===s).length);
  if(out)out.destroy();
  out=new Chart(document.getElementById('outChart'),{type:'doughnut',data:{labels:['Passed','Failed','Review'],datasets:[{data:o,backgroundColor:['#0f766e','#b42318','#b45309'],borderWidth:2}]},options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}}});
  document.getElementById('sections').innerHTML=exams[cur].sections.map(s=>`<div class="mb-3"><div class="d-flex justify-content-between small"><span>${s[0]}</span><strong>${s[1]}%</strong></div><div class="progress" style="height:6px"><div class="progress-bar" style="width:${s[1]}%;background:${col(s[1])}"></div></div></div>`).join('');
}
function table(){
  const q=document.getElementById('search').value.toLowerCase(),st=document.getElementById('statusSel').value;
  const list=data.filter(x=>x.n.toLowerCase().includes(q)&&(!st||x.status===st)).sort((a,b)=>b.score-a.score);
  const cls={Passed:'badge-pass',Failed:'badge-fail',Review:'badge-review'};
  document.getElementById('rows').innerHTML=list.map(x=>`<tr><td class="fw-medium">${x.n}</td><td><span class="bar"><i style="width:${x.score}%;background:${col(x.score)}"></i></span>${x.score}%</td><td>${x.time} min</td><td class="text-secondary">${fmt(x.d)}</td><td><span class="badge ${cls[x.status]}">${x.status}</span></td></tr>`).join('');
  document.getElementById('empty').classList.toggle('d-none',list.length>0);
}
function load(i){cur=i;data=build(i);kpis();charts();table();}
document.getElementById('examSel').onchange=e=>load(+e.target.value);
document.getElementById('search').oninput=table;
document.getElementById('statusSel').onchange=table;
document.getElementById('exportBtn').onclick=()=>{
  const rows=[['Student','Score %','Time (min)','Submitted','Outcome'],...data.map(x=>[x.n,x.score,x.time,fmt(x.d),x.status])];
  const blob=new Blob([rows.map(r=>r.map(v=>'"'+v+'"').join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=exams[cur].name.replace(/\s+/g,'-').toLowerCase()+'-results.csv';a.click();
};
load(0);
</script>
</body>
</html>
